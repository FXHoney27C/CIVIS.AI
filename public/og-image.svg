    <rect x="145" y="0" width="140" height="42" rx="8" fill="#172033" stroke="#334155" stroke-width="1.5" />
    <text x="215" y="26" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#00E5FF" text-anchor="middle">📍 MUMBAI</text>

    <rect x="300" y="0" width="170" height="42" rx="8" fill="#172033" stroke="#334155" stroke-width="1.5" />
    <text x="385" y="26" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#00E5FF" text-anchor="middle">📍 BENGALURU</text>

    <rect x="485" y="0" width="170" height="42" rx="8" fill="#172033" stroke="#334155" stroke-width="1.5" />
    <text x="570" y="26" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#00E5FF" text-anchor="middle">📍 HYDERABAD</text>

