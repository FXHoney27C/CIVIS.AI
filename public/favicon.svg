<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0F19" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Shield outline -->
  <path d="M32 14 L46 20 C46 32 39 42 32 48 C25 42 18 32 18 20 Z" 
        fill="url(#cyberGrad)" 
        fill-opacity="0.2" 
        stroke="#00E5FF" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  <!-- Core pulsing radar node -->
  <circle cx="32" cy="29" r="4.5" fill="#00E5FF" />
  <circle cx="32" cy="29" r="8" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Crosshairs -->
  <line x1="32" y1="18" x2="32" y2="22" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="36" x2="32" y2="40" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="21" y1="29" x2="25" y2="29" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="29" x2="43" y2="29" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
</svg>
